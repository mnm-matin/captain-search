[project]
name = "captain-search"
version = "0.1.0"
description = "Unified web, code, and webpage search for MCP agents and terminal workflows"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "Matin" }
]
keywords = ["search", "mcp", "cli", "ai", "llm", "web-search", "code-search", "fastmcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "fastmcp>=2.0",
    "httpx>=0.27",
    "mcp>=1.27.0",
    "pypdf",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "trafilatura",
]

[project.urls]
Homepage = "https://github.com/mnm-matin/captain-search"
Repository = "https://github.com/mnm-matin/captain-search"
Issues = "https://github.com/mnm-matin/captain-search/issues"
Releases = "https://github.com/mnm-matin/captain-search/releases"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

# Optional local document conversion (PDF/DOCX/PPTX/XLSX/etc.)
markitdown = [
    "markitdown",
]

markitdown-all = [
    "markitdown[all]",
]

[project.scripts]
captain-search = "captain_search.server:main"
csearch = "captain_search.server:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/captain_search"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
